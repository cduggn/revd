# Generated by revd. Owned by you — edit freely, revd will not overwrite it.
#
# Enabled linters map to concrete review concerns rather than style opinions.
# Run over changed code only:  golangci-lint run --new-from-rev=HEAD~
version: "2"
linters:
  default: none
  enable:
    # errors
    - errcheck        # unchecked errors
    - errorlint       # error wrapping correctness
    - nilerr          # returns nil despite a non-nil error
    - wrapcheck       # errors from other packages returned unwrapped
    # context & lifecycle
    - contextcheck    # non-inherited context
    - containedctx    # context stored in a struct
    - noctx           # http/sql calls without a context
    - fatcontext      # context created in a loop
    # resources
    - bodyclose       # HTTP response body not closed
    - sqlclosecheck   # sql.Rows/Stmt not closed
    - rowserrcheck    # Rows.Err not checked
    # structure
    - ireturn         # accept interfaces, return concrete types
    - nestif          # nested if pyramids
    - funlen          # over-long functions
    - gocyclo         # cyclomatic complexity
    - mnd             # magic numbers
    # correctness
    - staticcheck
    - ineffassign
    - gocritic
    - revive
  settings:
    revive:
      rules:
        - name: context-as-argument   # ctx must be the first parameter
        - name: error-return
        - name: error-naming
        - name: indent-error-flow     # happy path to the left
    funlen:
      lines: 80
    nestif:
      min-complexity: 4
    ireturn:
      allow: [error, stdlib, empty, generic]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
