# Generated by revd. Owned by you — edit freely, revd will not overwrite it.
line-length = 100
[lint]
select = [
  "E", "F",     # pycodestyle errors, pyflakes
  "B",          # bugbear: likely bugs
  "S",          # bandit: security
  "ASYNC",      # async correctness
  "T20",        # print() left in
  "RET",        # return-path clarity
  "SIM",        # simplifiable logic
  "PTH",        # pathlib over os.path
  "TRY",        # exception anti-patterns
]
ignore = ["E501"]  # line length is the formatter's job
[lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests
