[package]
name = "revd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Detect a project's languages and set up the linters, secret scanning and hooks they deserve"
license = "MIT"
repository = "https://github.com/cduggn/revd"
homepage = "https://github.com/cduggn/revd"
keywords = ["linter", "pre-commit", "static-analysis", "cli", "devtools"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
exclude = ["/.github", "/docs"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[package.metadata.binstall]
# Must match the artifact names produced by cargo-dist (see `dist plan`).
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ulid = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
