[package]
name = "revd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Detect a project's languages and set up the linters, secret scanning and hooks they deserve"
license = "MIT"
repository = "https://github.com/cduggn/revd"
homepage = "https://github.com/cduggn/revd"
keywords = ["linter", "pre-commit", "static-analysis", "cli", "devtools"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
exclude = ["/.github", "/docs"]

[package.metadata.binstall]
# Matches the asset names produced by .github/workflows/release.yml
pkg-url = "{ repo }/releases/download/{ version }/revd-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "revd"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ulid = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
